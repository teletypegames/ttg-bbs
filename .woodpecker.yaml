# TTG BBS: every push is linted with RuboCop (each board by its own rules), runs every folder's
# tests and every board's rake bbs:check, and compose.yaml is checked. A push to master deploys.
#
# The deploy step only asks the server to deploy. Its key (secret deploy_ssh_key) is bound on the
# server to one fixed command, `ci-deploy ttg-bbs` (infra/host-config), which clones master from
# Gitea itself, checks compose.yaml against a policy (no privileged, no extra capabilities or host
# namespaces, no docker socket, bind mounts only in the stack, the boards' public ports only),
# copies the core into the stack and boards/ in place (LIVE: the data of each board stays), runs
# docker compose up -d --build there and waits until the supervisor runs every board of the new
# revision, healthy. A change of boards/<name> only restarts that board (Rubbs::MultiRunner); a
# change of the image (Gemfile.lock, boards/common, bbs.rb, boards.yml, compose.yaml, Dockerfile)
# restarts them all, in order: the callers are told and get BBS_SHUTDOWN_SECONDS to leave.
when:
  - event: [push, manual]
    branch: master
  - event: pull_request

steps:
  - name: rubocop
    image: ruby:3.3-alpine
    commands:
      - apk add --no-cache git build-base
      - bundle install --jobs 4 --quiet
      - bundle exec rake rubocop

  - name: test
    image: ruby:3.3-alpine
    commands:
      - apk add --no-cache git build-base rsync
      - bundle install --jobs 4 --quiet
      - bundle exec rake

  - name: rdoc-common
    image: ruby:3.3
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - cd boards/common && rdoc -C lib | tee /tmp/coverage.txt
      - grep -q '100.00% documented' /tmp/coverage.txt

  - name: check
    image: docker:cli
    commands:
      - docker compose -f compose.yaml config --quiet

  - name: deploy
    image: git.teletypegames.org/build/deploy-ssh@sha256:e1753f7dd575caf5e835ff19cc152faa56478cad76c142ca0f47ad3a3f4a2605
    depends_on: [rubocop, test, rdoc-common, check]
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - mkdir -p -m 700 "$HOME/.ssh"
      - printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy" && chmod 600 "$HOME/.ssh/id_deploy"
      - echo 'vps.teletype.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR9RYc98lPw4w6LYlaVAkZTlleO+kE4vyWxEk9x3EDd' > "$HOME/.ssh/known_hosts"
      - ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@vps.teletype.hu
    when:
      - event: [push, manual]
        branch: master
        path:
          include: [compose.yaml, Dockerfile, .dockerignore, Gemfile, Gemfile.lock, bbs.rb, boards.yml, "bin/**", "boards/**"]
