# The shared RuboCop rules of the TTG boards: a board's .rubocop.yml inherits them
# (inherit_gem: { ttg-common: lib/ttg/board/rubocop.yml }) and adds its own exceptions after.
# Paths here are relative to the board (the file name has no leading dot).
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "data/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# The layout is the formatter's: `rake ttg:format` (rubocop -a) puts every
# file in this shape. What fits on a line (130) goes on one line; a call, a
# definition or a hash that does not gets one argument (key, parameter) a
# line, the closing bracket on a line of its own, and its keys lined up as a
# table. The same rules as rubbs'.
Layout/LineLength:
  Max: 130
Layout/RedundantLineBreak:
  Enabled: true
Layout/FirstMethodArgumentLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/FirstMethodParameterLineBreak:
  Enabled: true
Layout/MultilineMethodParameterLineBreaks:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table
Layout/ExtraSpacing:
  AllowForAlignment: true

# Menu items and window callbacks are one-line do…end blocks, and a
# `when … then form.error(…); :keep` table reads best on one line.
Style/BlockDelimiters:
  Enabled: false
Style/SingleLineDoEndBlock:
  Enabled: false
Style/Semicolon:
  AllowAsExpressionSeparator: true
Style/RescueStandardError:
  EnforcedStyle: explicit
Style/FetchEnvVar:
  Enabled: false

# Small methods, one thing each: the haiku rule. The DSL blocks of a face
# (Application.define, a window spec) are configuration, not logic, so only
# their length is free; what they call must still be small. A call, a hash
# or an array the formatter spreads over lines counts as one line.
Metrics/MethodLength:
  Max: 20
  CountAsOne: [array, hash, heredoc, method_call]
Metrics/AbcSize:
  Max: 25
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false
Metrics/ClassLength:
  Max: 200
  CountAsOne: [array, hash, heredoc, method_call]
Metrics/ModuleLength:
  Max: 200
  CountAsOne: [array, hash, heredoc, method_call]
Metrics/BlockLength:
  Max: 30
  CountAsOne: [array, hash, heredoc, method_call]
  AllowedMethods: [define, flow, window, app, describe, it]
  Exclude:
    - "test/**/*"

Style/Documentation:
  Enabled: false

# The helpers of an Application are methods defined in its DSL block, and the
# modern face builds its Application inside UI::Modern.flow.
Lint/NestedMethodDefinition:
  Exclude:
    - lib/ui/modern.rb

# Short names (f, el, w) are the idiom of the window callbacks and the parser.
Naming/MethodParameterName:
  MinNameLength: 1
