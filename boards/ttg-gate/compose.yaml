services:
  ttggate:
    mem_limit: 160m
    cpus: 1.0
    pids_limit: 256
    build: .
    container_name: ttggate
    ports:
      - "2399:2323"
    environment:
      - TZ=Europe/Budapest
      - BBS_MAX_SESSIONS=50
      - TTG_GATE_BBS_GATEWAY_HOST=host.docker.internal
      - TTG_GATE_BBS_PUBLIC_HOST=teletypegames.org
    extra_hosts:
      # The boards are dialled on their ports on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
