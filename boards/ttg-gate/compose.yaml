services:
  ttg-gate-bbs:
    mem_limit: 160m
    cpus: 1.0
    pids_limit: 256
    build: .
    container_name: ttg-gate-bbs
    ports:
      - "2399:2323"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Budapest
      - BBS_MAX_SESSIONS=50
      - TTG_GATE_BBS_GATEWAY_HOST=host.docker.internal
      - TTG_GATE_BBS_PUBLIC_HOST=teletypegames.org
      - RUBBS_AUTH_SECRET=${RUBBS_AUTH_SECRET:-}
      # TTG::Feedback's Discord line (that feedback came; the only Discord line of the boards).
      - TTG_GATE_BBS_FEEDBACK_WEBHOOK=${TTG_GATE_BBS_FEEDBACK_WEBHOOK:-}
    extra_hosts:
      # The boards are dialled on their ports on the host.
      - "host.docker.internal:host-gateway"
    # The Central (port 8090: the accounts on /auth and the network's services) is not published:
    # the other boards ask it on the interstack network as http://ttg-gate-bbs:8090.
    networks:
      - default
      - interstack
    restart: unless-stopped
    # rubbs tells the callers and gives them BBS_SHUTDOWN_SECONDS (20 s, Dockerfile) to leave.
    stop_grace_period: 30s

  # Global Discovery's prober: calls the boards of data/discovery.sqlite3 as they fall due (at
  # most 8 at once, one a host) and writes data/discovery-metrics.prom. The daily import runs in
  # this container too: docker exec ttg-gate-bbs-prober bin/discovery-import.
  ttg-gate-bbs-prober:
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    build: .
    container_name: ttg-gate-bbs-prober
    command: ["ruby", "bin/discovery-prober"]
    # The image's HEALTHCHECK asks the telnet port, which only the board has: the prober runs without
    # one, and docker-autoheal leaves it alone.
    healthcheck:
      disable: true
    labels:
      org.teletypegames.autoheal: "false"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Budapest
      - TTG_GATE_BBS_OPS_WEBHOOK=${TTG_GATE_BBS_OPS_WEBHOOK:-${TTG_GATE_BBS_DISCORD_WEBHOOK:-}}
    restart: unless-stopped

networks:
  interstack:
    name: interstack
    external: true
