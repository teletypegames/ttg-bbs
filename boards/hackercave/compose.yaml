services:
  hackercave-bbs:
    # 64 MB of Ruby, ~1.7 MB a caller, and the page cache of the daily mirror
    # (540 MB of texts, a 135 MB index) that the cgroup counts too: 160m left
    # the working set near 90% while it ran.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    build: .
    container_name: hackercave-bbs
    ports:
      - "2334:2323"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Budapest
      - BBS_MAX_SESSIONS=50
    restart: unless-stopped
    # rubbs tells the callers and gives them BBS_SHUTDOWN_SECONDS (20 s, Dockerfile) to leave.
    stop_grace_period: 30s
