services:
  ttgblog:
    mem_limit: 160m
    cpus: 1.0
    pids_limit: 256
    build: .
    container_name: ttgblog
    ports:
      - "2328:2323"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Budapest
      - BBS_MAX_SESSIONS=50
      - TTG_BLOG_BBS_HTTP_PORT=8080
      - TTG_BLOG_BBS_DISCORD_WEBHOOK=${TTGBLOG_DISCORD_WEBHOOK:-}
    # The read API (Web::Api, port 8080) is not published: teletypegames.org
    # reads it on the interstack network as http://ttgblog:8080.
    networks:
      - default
      - interstack
    restart: unless-stopped

networks:
  interstack:
    name: interstack
    external: true
