AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "data/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# The house style aligns hashes and keyword arguments as tables.
Layout/HashAlignment:
  Enabled: false
Layout/ExtraSpacing:
  AllowForAlignment: true
Layout/LineLength:
  Max: 130
# Continuation lines line up with what they continue, not with the call.
Layout/FirstArgumentIndentation:
  Enabled: false
Layout/ArgumentAlignment:
  Enabled: false
Layout/MultilineMethodCallBraceLayout:
  Enabled: false
Layout/ClosingParenthesisIndentation:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: false

# Menu items and window callbacks are one-line do…end blocks, and a
# `when … then form.error(…); :keep` table reads best on one line.
Style/BlockDelimiters:
  Enabled: false
Style/SingleLineDoEndBlock:
  Enabled: false
Style/Semicolon:
  AllowAsExpressionSeparator: true
Style/RescueStandardError:
  EnforcedStyle: explicit
Style/FetchEnvVar:
  Enabled: false

# Small methods, one thing each: the haiku rule. The DSL blocks of a face
# (Application.define, a window spec) are configuration, not logic, so only
# their length is free; what they call must still be small.
Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 25
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false
Metrics/ClassLength:
  Max: 200
Metrics/ModuleLength:
  Max: 200
Metrics/BlockLength:
  Max: 30
  AllowedMethods: [define, flow, window, app, section, helpers, menu, describe, it]
  Exclude:
    - "test/**/*"

Style/Documentation:
  Enabled: false

# The helpers of an Application are methods defined in its DSL block, and the
# modern face builds its Application inside UI::Modern.flow.
Lint/NestedMethodDefinition:
  Exclude:
    - lib/ui/modern.rb

# Short names (f, el, w) are the idiom of the window callbacks and the parser.
Naming/MethodParameterName:
  MinNameLength: 1
