services:
  bbs:
    mem_limit: 192m
    build: .
    container_name: teletype-bbs
    ports:
      - "2323:2323"
    volumes:
      - ./data:/app/data
    environment:
      - MESSAGES_PATH=/app/data/messages.dat
      - BBS_SYSOPS=${BBS_SYSOPS:-}
      - BBS_DISCORD_WEBHOOK=${BBS_DISCORD_WEBHOOK:-}
      - SERMO_LLM_URL=http://llm:8080
      - SERMO_LLM_MODEL=qwen3.5-0.8b
      - SERMO_LLM_API_KEY=${SERMO_LLM_API_KEY:-}
      - BBS_LLM_API_KEY=${BBS_LLM_API_KEY:-}
    networks:
      - default
      - interstack
    restart: unless-stopped
    stdin_open: true
    tty: true

# SERMO's Lapis-ACP thinks with Qwen3.5 0.8B in the shared model service (infra/llm),
# reached on the interstack network. Without it SERMO answers with its canned replies.
networks:
  interstack:
    external: true
