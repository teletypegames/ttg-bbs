services:
  bbs-server:
    build: .
    container_name: bbs-server-prod
    ports:
      - "2323:2323"
    environment:
      - WEBAPP_WIKIJS_TOKEN=${WEBAPP_WIKIJS_TOKEN}
      - MESSAGES_PATH=/app/data/messages.dat
    volumes:
      - bbs-messages:/app/data
    restart: always
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bbs-messages:
