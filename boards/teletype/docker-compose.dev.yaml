services:
  bbs:
    build: .
    container_name: teletype-bbs
    ports:
      - "2323:2323"
    volumes:
      - ./:/app/
    environment:
      - MESSAGES_PATH=/app/data/messages.dat
      - BBS_SYSOPS=${BBS_SYSOPS:-}
      - BBS_DISCORD_WEBHOOK=${BBS_DISCORD_WEBHOOK:-}
    restart: unless-stopped
    stdin_open: true
    tty: true
