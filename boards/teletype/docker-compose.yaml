services:
  bbs:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: teletype-bbs
    ports:
      - "2323:2323"
    volumes:
      - ./:/app/
    environment:
      - WEBAPP_WIKIJS_TOKEN=${WEBAPP_WIKIJS_TOKEN:-}
    restart: unless-stopped
    stdin_open: true
    tty: true
