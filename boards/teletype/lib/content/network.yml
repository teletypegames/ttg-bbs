# The Teletype Games BBS Network as the town around the clubhouse: the town map (Board > BBS
# Network on the modern face, N on the C64) and every list of the boards come from here. The same
# boards as the TTG Gate BBS dials (bbs/ttg-gate-bbs config/boards.yml) and the bbsweb cards
# (services/bbs-web config/config.json), kept in step by hand.
#
# [id]       the board's id, as in bbsweb; its buildings are art/modern/building_<id>.yml (12x4)
#            and art/c64/building_<id>.yml (3x3)
# [name]     the board's name
# [port]     its telnet port on teletypegames.org
# [building] what it is in the town
# [about]    what it carries, a line for the map and the lists
# [short]    its name on the C64 map (seven letters at most)
# [words]    two words about it for the C64 map
# [accent]   its bbsweb accent colour; the C64 takes [c64], one of its sixteen like it
# [place]    the top left of its building on the modern map [col, row], and on the C64 one
# The town is the river town (art/*/town.yml): the plots stand in five rows along the Data Stream,
# the clubhouse on the square in the middle one. A building takes 12×4 and its name the row under
# it, 18 wide from col-3 (modern); 3×3 and 9 wide from col-3 (C64). The arrows walk to the nearest
# building in their direction, wherever the buildings stand.
# A new board: a row here, its two buildings, and a free lot of the town for its place (the fenced
# FREE LOT plots, modern [41, 18] [23, 24] [42, 24], C64 [23, 12] [14, 16] [24, 16]); take its fence
# out of the two town arts.
clubhouse:
  name: Teletype BBS
  port: 2323
  building: the clubhouse
  about: this board, the clubhouse - the wall, the voting booth and our own doors
  accent: '#3cff7a'
  c64: light_green
