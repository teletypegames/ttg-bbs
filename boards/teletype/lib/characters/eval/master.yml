# Questions the eval asks the TTG Master. +expect+: the reply must contain
# one of these (case-insensitive), else it counts as a miss.
- q: hi
- q: how do I register my name?
  expect: [You > Register]
- q: where can I find DOS programs?
  expect: [TTG Wiki BBS, '2325', DOSINST]
- q: what's new?
  expect: [Underwater Sun Rise, C64 Demo, WARP64U, WarpEngine BBS]
- q: are there any events coming up?
  expect: [Underwater Sun Ris, No events]
- q: which games do you have for the c64?
  expect: [Blessing of Ra, Rabbit Scooter, C64 Demo]
- q: how do I leave a message?
  expect: [Messages > The Wall, F2]
- q: how do I get out of here?
  expect: [Board > Log off, Alt-X]
- q: what is SERMO?
  expect: [Neumatronic]
- q: can I play the games in a browser?
  expect: [catalog, bbsweb]
- q: is there an FTP server?
  expect: [ftp.teletypegames.org, archive.teletypegames.org]
- q: where is the ANSI art?
  expect: [Pixelia BBS, '2332']
- q: is there anything about star trek?
  expect: [Starbase BBS, '2333']
- q: where can I find films?
  expect: [Kinema BBS, '2337']
- q: where can I read the RFCs?
  expect: [HackerCave BBS, '2334']
- q: what is the meaning of life?
  expect: [do not know, wiki]
- q: write me a poem about cats
  expect: [do not know, wiki, board]
- q: who made this board?
  expect: [Teletype Games]
- q: how do I use the commodore door?
  expect: [LOAD]
- q: how do I make a window full screen?
  expect: [F5]
- q: can I move a window?
  expect: [F6, Ctrl-F5, drag]
- q: how do I send a private message to someone?
  expect: [TTG Mail BBS, '2335']
- q: is there a game I can play here?
  expect: [TTG Trivia, Doors]
- q: where can I vote?
  expect: [Voting Booth]
- q: where are the files?
  expect: [WarpEngine BBS, '2329']
- q: where can I download your games?
  expect: [WarpEngine BBS, '2329']
- q: where is the wiki?
  expect: [TTG Wiki BBS, '2325']
- q: where can I read your blog?
  expect: [TTG Blog BBS, '2328']
- q: can I read Wikipedia here?
  expect: [Alexandria BBS, '2326']
- q: do you have any books?
  expect: [Scriptorium BBS, '2330']
- q: are there cheats for c64 games?
  expect: [Commodex BBS, '2331']
- q: where do I enter my Impostor code?
  expect: [Impostor BBS, '2324']
- q: can I reach all your boards from one port?
  expect: [TTG Gate BBS, '2399']
- q: where are the trophies?
  expect: [People > Hall of Fame]
- q: where is the games room?
  expect: [Doors > Games Room]
- q: what is the town map?
  expect: [Board > BBS Network]
