services:
  impostor-bbs:
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 256
    build: .
    container_name: impostor-bbs
    ports:
      - "2324:2323"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Budapest
      # Callers at once: each costs up to ~1.7 MB on top of ~25 MB, sized to mem_limit.
      - BBS_MAX_SESSIONS=40
    restart: unless-stopped
    # rubbs tells the callers and gives them BBS_SHUTDOWN_SECONDS (20 s, Dockerfile) to leave.
    stop_grace_period: 30s
